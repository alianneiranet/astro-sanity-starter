name: Jailbreak Checker

on:
  push:
    paths:
      - "jailbreak-checker/**"
      - ".github/workflows/jailbreak-checker.yml"
  pull_request:
    paths:
      - "jailbreak-checker/**"
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jailbreak-checker/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: paste the content of google-services.json into this repository secret
      # to build an APK connected to your Firebase project (live AI updates + news).
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret: building the offline version"
          fi

      # Optional: base64 keystore + passwords for a stable release signature.
      - name: Add signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: revisor-jailbreak-apk
          path: |
            jailbreak-checker/android/app/build/outputs/apk/release/*.apk
            jailbreak-checker/android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: jailbreak-checker/android/app/build/screenshots/

  functions:
    name: Firebase functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jailbreak-checker/firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jailbreak-checker/firebase/functions/package-lock.json
      - run: npm ci
      - run: npm test
